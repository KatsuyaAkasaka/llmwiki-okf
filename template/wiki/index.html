<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmwiki</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1f26; --muted: #667085; --accent: #2563eb;
    --panel: #f4f6f8; --border: #e3e8ee; --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --fg: #e6e9ed; --muted: #8b95a3; --accent: #7aa2ff;
      --panel: #1a1f26; --border: #2a3038; --code-bg: #1e242c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  nav {
    width: 290px; flex: none; border-right: 1px solid var(--border);
    background: var(--panel); padding: 1.2rem 1rem; overflow-y: auto;
    position: sticky; top: 0; height: 100vh;
  }
  nav .brand { font-weight: 700; font-size: 1.05rem; margin-bottom: .8rem; display: block;
    color: var(--fg); text-decoration: none; }
  nav h1 { display: none; }
  nav h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 1.2rem 0 .3rem; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin: .15rem 0; }
  nav a { color: var(--fg); text-decoration: none; font-size: .9rem; }
  nav a:hover { color: var(--accent); }
  nav p { font-size: .8rem; color: var(--muted); }
  main { flex: 1; min-width: 0; padding: 2rem clamp(1rem, 5vw, 4rem); max-width: 60rem; }
  main a { color: var(--accent); }
  main h1, main h2, main h3 { line-height: 1.3; }
  main h1 { margin-top: .2rem; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: .9rem 1rem; overflow-x: auto; font-size: .86rem; }
  code { background: var(--code-bg); border-radius: 4px; padding: .1em .35em; font-size: .9em; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 0; padding: .1rem 1rem; border-left: 3px solid var(--border);
    color: var(--muted); }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: .35rem .7rem; font-size: .92rem; }
  th { background: var(--panel); text-align: left; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
  .meta {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: .8rem 1rem; margin-bottom: 1.6rem; font-size: .85rem;
  }
  .meta .badges { display: flex; flex-wrap: wrap; gap: .4rem; }
  .badge { border-radius: 999px; padding: .1rem .7rem; font-size: .78rem;
    border: 1px solid var(--border); background: var(--bg); }
  .badge.trust-human { border-color: #16a34a; color: #16a34a; }
  .badge.trust-machine { border-color: #d97706; color: #d97706; }
  .badge.trust-none { color: var(--muted); }
  .badge.stale { border-color: #dc2626; color: #dc2626; }
  .meta details { margin-top: .5rem; }
  .meta summary { cursor: pointer; color: var(--muted); }
  .meta pre { margin: .5rem 0 0; }
  .crumb { font-size: .8rem; color: var(--muted); margin-bottom: .6rem; }
  .crumb a { color: var(--muted); }
  .error { color: #dc2626; }
  sup a { text-decoration: none; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav { width: 100%; height: auto; position: static; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"><a class="brand" href="#/index.md">llmwiki</a><p>loading index…</p></nav>
  <main id="main"><p>loading…</p></main>
</div>
<script>
"use strict";
/* llmwiki viewer — self-contained, relative-path fetch only, so it works on any
   static host (GCS direct URL, custom domain, local `python -m http.server`). */

const $nav = document.getElementById("nav");
const $main = document.getElementById("main");

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
}

/* ---------- path handling ---------- */
function normalize(path) {
  const parts = [];
  for (const seg of path.split("/")) {
    if (seg === "" || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}
function currentPage() {
  const h = location.hash.replace(/^#\/?/, "");
  return h ? normalize(decodeURIComponent(h)) : "index.md";
}
/* Resolve a markdown link target to a bundle path, or null if external. */
function resolveLink(href, fromPath) {
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) return null;
  if (href.startsWith("#")) return null;
  const [target] = href.split("#");
  if (!/\.md$/i.test(target)) return null;
  if (target.startsWith("/")) return normalize(target);
  const dir = fromPath.includes("/") ? fromPath.slice(0, fromPath.lastIndexOf("/")) : "";
  return normalize((dir ? dir + "/" : "") + target);
}

/* ---------- frontmatter ---------- */
function splitFrontmatter(text) {
  const m = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*\r?\n?/);
  return m ? { yaml: m[1], body: text.slice(m[0].length) } : { yaml: null, body: text };
}
function yamlScalar(yaml, key) {
  const m = yaml.match(new RegExp("^" + key + ":[ \\t]*(.+)$", "m"));
  if (!m) return null;
  return m[1].trim().replace(/^["']|["']$/g, "");
}
function trustTier(yaml) {
  if (!/^verified:/m.test(yaml)) return ["unverified", "trust-none"];
  return /by:[ \t]*["']?human:/.test(yaml)
    ? ["human-reviewed", "trust-human"] : ["machine-confirmed", "trust-machine"];
}
function metaPanel(yaml) {
  const badges = [];
  const type = yamlScalar(yaml, "type");
  if (type) badges.push(`<span class="badge">${esc(type)}</span>`);
  const status = yamlScalar(yaml, "status") || "stable";
  badges.push(`<span class="badge">${esc(status)}</span>`);
  const [tier, cls] = trustTier(yaml);
  badges.push(`<span class="badge ${cls}">${tier}</span>`);
  const stale = yamlScalar(yaml, "stale_after");
  if (stale && stale <= new Date().toISOString().slice(0, 10))
    badges.push(`<span class="badge stale">stale since ${esc(stale)}</span>`);
  const tags = yaml.match(/^tags:[ \t]*\[(.*)\]/m);
  if (tags) for (const t of tags[1].split(","))
    if (t.trim()) badges.push(`<span class="badge">#${esc(t.trim())}</span>`);
  return `<div class="meta"><div class="badges">${badges.join("")}</div>` +
    `<details><summary>frontmatter</summary><pre>${esc(yaml)}</pre></details></div>`;
}

/* ---------- markdown rendering (GFM subset) ---------- */
function inline(text, page) {
  let out = esc(text);
  out = out.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  out = out.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) =>
    `<img src="${esc(src)}" alt="${alt}" style="max-width:100%">`);
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, href) => {
    const page2 = resolveLink(href, page);
    return page2 !== null
      ? `<a href="#/${esc(page2)}">${label}</a>`
      : `<a href="${esc(href)}" rel="noopener"${/^https?:/.test(href) ? ' target="_blank"' : ""}>${label}</a>`;
  });
  out = out.replace(/\[\^([\w-]+)\]/g,
    (_, id) => `<sup><a href="#fn-${id}" id="ref-${id}">[${id}]</a></sup>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return out;
}

function render(md, page) {
  const lines = md.split(/\r?\n/);
  const html = [];
  const footnotes = [];
  let i = 0, para = [];
  const flush = () => {
    if (para.length) { html.push(`<p>${inline(para.join(" "), page)}</p>`); para = []; }
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {                       // fenced code
      flush();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)/);      // heading
    if (h) { flush(); html.push(`<h${h[1].length}>${inline(h[2], page)}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { flush(); html.push("<hr>"); i++; continue; }
    const fn = line.match(/^\[\^([\w-]+)\]:\s+(.*)/);  // footnote definition
    if (fn) { footnotes.push([fn[1], fn[2]]); i++; continue; }
    if (/^\s*>/.test(line)) {                      // blockquote
      flush();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i]))
        buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      html.push(`<blockquote>${render(buf.join("\n"), page)}</blockquote>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {     // list (flat + one nesting level)
      flush();
      const ordered = /^\s*\d/.test(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
               !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]))
          item += " " + lines[i++].trim();
        items.push(`<li>${inline(item, page)}</li>`);
      }
      html.push(`<${tag}>${items.join("")}</${tag}>`);
      continue;
    }
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flush();                                      // table
      const row = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
        .split("|").map((c) => c.trim());
      const head = row(line); i += 2;
      const body = [];
      while (i < lines.length && /\|/.test(lines[i])) body.push(row(lines[i++]));
      html.push("<table><thead><tr>" +
        head.map((c) => `<th>${inline(c, page)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c, page)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }
    if (/^\s*$/.test(line)) { flush(); i++; continue; }
    para.push(line.trim()); i++;
  }
  flush();
  if (footnotes.length) {
    html.push("<hr><ol>" + footnotes.map(([id, txt]) =>
      `<li id="fn-${id}">${inline(txt, page)} <a href="#ref-${id}">↩</a></li>`).join("") + "</ol>");
  }
  return html.join("\n");
}

/* ---------- app ---------- */
async function fetchPage(path) {
  const res = await fetch(path, { cache: "no-cache" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.text();
}

async function show() {
  const page = currentPage();
  try {
    const text = await fetchPage(page);
    const { yaml, body } = splitFrontmatter(text);
    let out = "";
    if (page !== "index.md")
      out += `<div class="crumb"><a href="#/index.md">index</a> / ${esc(page)}</div>`;
    if (yaml && !/^okf_version:/m.test(yaml.trim().split("\n")[0] || "") && page !== "index.md")
      out += metaPanel(yaml);
    out += render(body, page);
    $main.innerHTML = out;
    const t = yaml && yamlScalar(yaml, "title");
    document.title = (t ? t + " — " : "") + "llmwiki";
    window.scrollTo(0, 0);
  } catch (e) {
    $main.innerHTML = `<p class="error">Could not load <code>${esc(page)}</code>: ${esc(String(e.message))}</p>` +
      `<p><a href="#/index.md">back to index</a></p>`;
  }
}

async function buildNav() {
  try {
    const text = await fetchPage("index.md");
    const { body } = splitFrontmatter(text);
    $nav.innerHTML = `<a class="brand" href="#/index.md">llmwiki</a>` +
      render(body, "index.md").replace(/<p>[^]*?<\/p>/, "");
  } catch {
    $nav.innerHTML = `<a class="brand" href="#/index.md">llmwiki</a><p>index.md not found</p>`;
  }
}

window.addEventListener("hashchange", show);
buildNav();
show();
</script>
</body>
</html>
